# Publishes the client to npm's `beta` tag when a v* tag is pushed.
#
# Always `pnpm publish`, never `npm publish`.
#
# Before tagging: run scripts/pre-tag-gate.sh on the commit, and run the "npm credential check" workflow once (it has never run here).
# The first publish also needs the repo secret NPM_TOKEN, an npm automation token. That secret is Andre's to add.
# Nothing publishes until a tag equal to `v<version in package.json>` is pushed, and the release check below refuses a build whose
# shipped issuer list or Concierge address is empty, so merging this does not release anything.
# This publishes to `beta` only. `latest` moves with the "npm promote to latest" workflow.
name: Publish

on:
  push:
    tags: ['v*']

jobs:
  # The prebuilt Mac app, @cello-protocol/mac-app, which the cli names as an optional dependency at exactly this version.
  # It goes first, so the cli is never on npm naming an app that isn't. Only a Mac can build it: macOS runners are free for
  # a public repo. Its first run on a runner is the first proof the app builds there.
  mac-app:
    name: Publish the Mac app to npm (beta)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches both packages' version
        run: |
          want="v$(node -p "require('./package.json').version")"
          mac="v$(node -p "require('./mac-app/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ] || [ "$mac" != "$want" ]; then
            echo "FAIL: the tag is $GITHUB_REF_NAME, package.json says $want and mac-app/package.json says $mac. All three must match."
            exit 1
          fi

      # The Swift the app is built and tested with. A newer image default could build differently, so it's named.
      - name: Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || { echo "FAIL: this runner image has no Xcode 16.4. Pick the one the app is tested with."; ls -d /Applications/Xcode*; exit 1; }
          xcrun swiftc --version

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      # A re-run after the cli job failed finds this version already published, and a version is never published twice.
      - name: Is this version already on npm?
        id: published
        run: |
          version=$(node -p "require('./mac-app/package.json').version")
          if npm view "@cello-protocol/mac-app@$version" version >/dev/null 2>&1; then
            echo "@cello-protocol/mac-app@$version is already on npm, so it isn't built or published again."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # prepack builds the app with widgets/mac/scripts/assemble.sh and refuses one without both architectures, a valid
      # ad-hoc signature, or this version.
      - name: Build and pack the app
        if: steps.published.outputs.skip != 'true'
        working-directory: mac-app
        run: |
          packed=$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -1)
          echo "TARBALL=$packed" >> "$GITHUB_ENV"

      - name: The tarball holds the whole app, runnable and signed, and nothing else
        if: steps.published.outputs.skip != 'true'
        run: sh mac-app/check-tarball.sh "$TARBALL"

      - name: Publish
        if: steps.published.outputs.skip != 'true'
        run: pnpm publish "$TARBALL" --access public --no-git-checks --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The one npm serves, checked the same way, before the cli is allowed to name it.
      - name: The published app is the one checked
        run: |
          version=$(node -p "require('./mac-app/package.json').version")
          mkdir -p "$RUNNER_TEMP/served"
          for attempt in $(seq 1 60); do
            if served=$(cd "$RUNNER_TEMP/served" && npm pack "@cello-protocol/mac-app@$version" 2>/dev/null | tail -1) && [ -n "$served" ]; then
              sh mac-app/check-tarball.sh "$RUNNER_TEMP/served/$served"
              exit $?
            fi
            echo "@cello-protocol/mac-app@$version isn't served yet (attempt $attempt of 60)"
            sleep 10
          done
          echo "FAIL: @cello-protocol/mac-app@$version is missing after 10 minutes. Re-run this job: it skips publishing a version that's there."
          exit 1

  publish:
    name: Publish to npm (beta)
    needs: mac-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The package may be published, and the tag matches its version
        run: |
          if [ "$(node -p "require('./package.json').private === true")" = "true" ]; then
            echo "FAIL: package.json still says private: true. Removing it is the last step before going public."
            exit 1
          fi
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "FAIL: the tag is $GITHUB_REF_NAME, but package.json says $want."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - run: pnpm install --frozen-lockfile
      # Empty shipped list or empty Concierge address, or a list the production roots didn't sign: refused before anything is built.
      - run: node tools/check-release.ts
      - run: pnpm run test
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build

      # v1 once shipped a package holding one file where the last held 128, with every test green.
      - name: The tarball carries what was built
        run: |
          built=$(find dist -name '*.js' | wc -l | tr -d ' ')
          packed=$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -1)
          shipped=$(tar tzf "$packed" | grep -c '^package/dist/.*\.js$' || true)
          echo "$shipped of $built built files are in the tarball"
          if [ "$built" -eq 0 ] || [ "$shipped" -lt "$built" ]; then
            echo "FAIL: packing dropped files, so nothing was published."
            exit 1
          fi
          # The app is its own package. The cli must name it at its own version, never workspace:*, and never carry it.
          named=$(tar -xzOf "$packed" package/package.json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).optionalDependencies?.['@cello-protocol/mac-app'] ?? 'missing'))")
          version=$(node -p "require('./package.json').version")
          if [ "$named" != "$version" ]; then
            echo "FAIL: the packed cli names @cello-protocol/mac-app as '$named', not $version."
            exit 1
          fi
          if tar tzf "$packed" | grep -q 'CELLO\.app/'; then
            echo "FAIL: the cli tarball carries the Mac app, which belongs in @cello-protocol/mac-app."
            exit 1
          fi

      - name: Publish
        run: pnpm publish --access public --no-git-checks --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Asks for the exact version in the registry's time map, because a dist-tag read can be stale.
      # npm can take minutes to list an accepted upload, so a 60-second wait failed good releases on v1.
      - name: The version is on the registry
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          encoded=$(node -p "encodeURIComponent(process.argv[1])" "$name")
          for attempt in $(seq 1 60); do
            if curl -s -H 'Cache-Control: no-cache' "https://registry.npmjs.org/$encoded" \
                 | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{process.exit(JSON.parse(d).time?.[process.argv[1]]?0:1)}catch{process.exit(1)}})" "$version"; then
              echo "OK: $name@$version is on the registry"
              exit 0
            fi
            echo "$name@$version isn't on the registry yet (attempt $attempt of 60)"
            sleep 10
          done
          echo "FAIL: $name@$version is missing after 10 minutes. The version isn't burned, so re-run this job."
          exit 1
